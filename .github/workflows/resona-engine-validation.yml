name: Resona Engine Validation
on:
  push:
    paths:
      - "Resona Fallout Project/**"
jobs:
  typecheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: "Resona Fallout Project"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install
      - run: npm run check
