name: Package Resona Fallout Project

on:
  push:
    paths:
      - "Resona Fallout Project/**"
      - "!Resona Fallout Project/resona-fallout-project.zip"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create and validate ZIP
        shell: bash
        run: |
          set -euo pipefail
          rm -f "Resona Fallout Project/resona-fallout-project.zip"
          git archive --format=zip --output="Resona Fallout Project/resona-fallout-project.zip" HEAD "Resona Fallout Project"
          unzip -t "Resona Fallout Project/resona-fallout-project.zip"
      - name: Commit ZIP
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Resona Fallout Project/resona-fallout-project.zip"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Package Resona Fallout Project ZIP"
          git push
